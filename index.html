<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Romy Health">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <title>Romy Health</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p id="todayLabel" class="eyebrow"></p>
        <h1>Romy Health</h1>
      </div>
      <button class="icon-button" id="settingsButton" aria-label="Instellingen">⚙</button>
    </header>

    <main>
      <section id="view-today" class="view active"></section>
      <section id="view-training" class="view"></section>
      <section id="view-running" class="view"></section>
      <section id="view-strength" class="view"></section>
      <section id="view-nutrition" class="view">
        <section class="section-heading">
          <div><p class="eyebrow">VOEDING</p><h2>Dagoverzicht</h2></div>
          <button class="secondary-button" id="addNutrition">+ Dag</button>
        </section>
        <div id="nutritionDates" class="date-row"></div>
        <article id="calorieCard" class="calorie-card"></article>
        <div id="nutrientGrid" class="nutrient-grid"></div>
        <section class="section-heading"><div><p class="eyebrow">GESCHIEDENIS</p><h2>Opgeslagen dagen</h2></div></section>
        <div id="nutritionHistory" class="history-list"></div>
      </section>
      <section id="view-progress" class="view"></section>
    </main>

    <button class="fab" id="fab" aria-label="Toevoegen">+</button>

    <nav class="bottom-nav">
      <button class="nav-item active" data-target="today"><span>⌂</span><small>Vandaag</small></button>
      <button class="nav-item" data-target="training"><span>☷</span><small>Schema</small></button>
      <button class="nav-item" data-target="running"><span>♧</span><small>Hardlopen</small></button>
      <button class="nav-item" data-target="strength"><span>↔</span><small>Kracht</small></button>
      <button class="nav-item" data-target="nutrition"><span>◯</span><small>Voeding</small></button>
      <button class="nav-item" data-target="progress"><span>▥</span><small>Inzichten</small></button>
    </nav>
  </div>

  <section class="modal-backdrop hidden" id="nutritionModal">
    <div class="modal-card">
      <div class="modal-header"><h2>Voeding toevoegen</h2><button class="icon-button close-modal">×</button></div>
      <form id="nutritionForm" class="form-grid">
        <label>Datum<input name="date" type="date" required></label>
        <label>Calorieën<input name="calories" type="number" inputmode="decimal"></label>
        <label>Eiwit (g)<input name="protein" type="number" step="0.1" inputmode="decimal"></label>
        <label>Koolhydraten (g)<input name="carbs" type="number" step="0.1" inputmode="decimal"></label>
        <label>Vezels (g)<input name="fiber" type="number" step="0.1" inputmode="decimal"></label>
        <label>Suiker (g)<input name="sugar" type="number" step="0.1" inputmode="decimal"></label>
        <label>Zout (g)<input name="salt" type="number" step="0.1" inputmode="decimal"></label>
        <label>Verzadigd vet (g)<input name="satFat" type="number" step="0.1" inputmode="decimal"></label>
        <button class="primary-button full" type="submit">Opslaan</button>
      </form>
    </div>
  </section>

  <section class="modal-backdrop hidden" id="trainingModal">
    <div class="modal-card">
      <div class="modal-header"><h2>Training registreren</h2><button class="icon-button close-modal">×</button></div>
      <form id="trainingForm" class="form-grid">
        <label>Datum<input name="date" type="date" required></label>
        <label>Type<select name="type"><option>Hardlopen</option><option>Kracht</option><option>Volleybal</option><option>Zwemmen</option><option>Spinning</option><option>Beachvolleybal</option><option>Overig</option></select></label>
        <label>Duur (min)<input name="minutes" type="number" inputmode="decimal"></label>
        <label>RPE (1–10)<input name="rpe" type="number" min="1" max="10" step="1"></label>
        <button class="primary-button full" type="submit">Opslaan</button>
      </form>
    </div>
  </section>

  <section class="modal-backdrop hidden" id="settingsModal">
    <div class="modal-card settings-card">
      <div class="modal-header"><h2>Instellingen</h2><button class="icon-button close-modal">×</button></div>
      <div class="settings-list">
        <button id="exportData"><span>⇩</span><div><strong>Data exporteren</strong><small>Download een JSON-back-up van je lokale gegevens</small></div></button>
        <label class="settings-file"><span>⇧</span><div><strong>Data importeren</strong><small>Herstel een eerder geëxporteerde back-up</small></div><input id="importData" type="file" accept="application/json"></label>
        <button id="clearData"><span>⌫</span><div><strong>Lokale data wissen</strong><small>Verwijdert alleen de gegevens op dit apparaat</small></div></button>
      </div>
      <div class="cloud-panel">
        <p class="eyebrow">CLOUD SYNC</p>
        <div id="cloudStatus">Niet ingelogd</div>
        <form id="authForm" class="form-grid">
          <label>E-mailadres<input id="authEmail" type="email"></label>
          <label>Wachtwoord<input id="authPassword" type="password"></label>
          <div class="button-row"><button class="primary-button" id="loginButton" type="button">Inloggen</button><button class="secondary-button" id="signupButton" type="button">Account maken</button></div>
        </form>
        <div class="button-row"><button class="secondary-button" id="syncUpButton" type="button">Upload</button><button class="secondary-button" id="syncDownButton" type="button">Download</button><button class="secondary-button" id="logoutButton" type="button">Uitloggen</button></div>
      </div>
      <p class="privacy-note">Zonder cloudaccount blijven je gegevens lokaal op dit apparaat.</p>
    </div>
  </section>

  <script src="app.js"></script>
  <script src="schedule.js"></script>
  <script id="marathonPlan2027Script" src="marathon-plan-2027.js?v=1"></script>
  <script src="training-extras.js"></script>
  <script src="strength-workouts.js"></script>
  <script src="nutrition-import.js?v=44"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-sync.js"></script>
  <script src="health-automation.js"></script>
  <script src="nightly-review.js?v=5"></script>
  <script src="week-overview.js?v=35"></script>
  <script id="tredictIntelligenceScript" src="tredict-intelligence.js?v=44"></script>
  <script id="insightsReorgScript" src="insights-reorg.js?v=1"></script>
  <script id="progressMotivationScript" src="progress-motivation.js?v=1"></script>
  <script id="minimalUiDirect" src="minimal-ui.js?v=5"></script>
  <script id="schemaListDirect" src="schema-list.js?v=5"></script>
  <script id="dashboardInsightsDirect" src="dashboard-insights-v2.js?v=44"></script>
</body>
</html>
